spring:
  application:
    name: GrandTourBend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grand_tour_bend}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
    show-sql: true
