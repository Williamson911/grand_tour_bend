spring:
  application:
    name: GrandTourBend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grand_tour_bend}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:william.williamson.91@gmail.com}
    password: ${MAIL_PASSWORD:***REDACTED***}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
